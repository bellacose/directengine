# Supabase CLI settings for `supabase functions deploy`. Only what differs from the defaults.
project_id = "directory-engine"

# Public endpoints reached through each site's own domain (/go/*, /track/). No user JWT exists there;
# each function checks its own input and writes with the service key from its environment.
[functions.go]
verify_jwt = false

[functions.track]
verify_jwt = false
