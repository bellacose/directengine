# Supabase CLI settings for `supabase functions deploy`. Only what differs from the defaults.
project_id = "directory-engine"

# Public endpoints reached through each site's own domain (/go/*, /track/, /submit-claim/,
# /report-change/, /confirm-claim/). No user JWT exists there; each function checks its own input and writes with
# the service key from its environment.
[functions.go]
verify_jwt = false

[functions.track]
verify_jwt = false

# The public forms (/submit-claim/, /report-change/). Optional secret TURNSTILE_SECRET_KEY turns on
# the Cloudflare Turnstile check; set it together with the site builds' TURNSTILE_SITE_KEY.
[functions.submit-claim]
verify_jwt = false

[functions.report-change]
verify_jwt = false

# The link in the claim confirmation email (/confirm-claim/?token=...). submit-claim sends that email
# once an email provider is chosen (D??); its key will be a function secret, never in this file.
[functions.confirm-claim]
verify_jwt = false

# The seed `supabase db push --include-seed` applies (the CLI default, stated so it isn't lost).
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
